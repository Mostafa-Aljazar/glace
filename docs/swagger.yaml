        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Wallet]
      summary: Submit a receipt-based wallet top-up request
      description: |
        **Not implemented yet (handoff 14).** Covers `bop`/`paypal`/
        `jawwal-manual` only — the customer transfers externally, then
        uploads the receipt here. Stays `قيد المراجعة` until an admin
        approves it from Filament and sets the real `amount` off the
        receipt — there is no user-facing approval endpoint, and the
        customer never types the amount themselves (avoids it disagreeing
        with what the receipt actually shows).

        The `jawwal` (automatic) method does **not** use this endpoint — see
        `POST /wallet/topup-requests/jawwal/send-code` and `.../confirm`
        below, which credit the balance immediately instead of queuing a
        request for manual review.
      operationId: submitTopUpRequest
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [method, receiptImage]
              properties:
                method:
                  type: string
                  enum: [bop, paypal, jawwal-manual]
                receiptImage:
                  type: string
                  format: binary
                receiptNote:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Created (`TopUpRequest`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /wallet/topup-requests/jawwal/send-code:
    post:
      tags: [Wallet]
      summary: Start a jawwal (automatic) top-up — server asks JawwalPay to text a payment code
      description: |
        **Not implemented yet (handoff 14).** The server calls JawwalPay's
        API to push an SMS to `phone` asking the customer to confirm paying
        `amount` — the code is generated and owned by JawwalPay, not by our
        backend. The frontend never talks to JawwalPay directly. Rate-limit
        per phone to avoid SMS abuse.
      operationId: sendJawwalTopUpCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, amount]
              properties:
                phone:
                  type: string
                  example: "0599123456"
                amount:
                  type: number
                  example: 50
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                    example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Too many code requests for this phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /wallet/topup-requests/jawwal/confirm:
    post:
      tags: [Wallet]
      summary: Confirm a jawwal top-up with the code JawwalPay texted the customer
      description: |
        **Not implemented yet (handoff 14).** The server verifies `code`
        against JawwalPay for this `phone`/`amount` pair. On success the
        transfer already happened on JawwalPay's side, so — unlike the
        receipt-based methods — the wallet balance is credited immediately
        and the returned `TopUpRequest.status` is `مكتمل`, with no manual
        review step.
      operationId: confirmJawwalTopUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, amount, code]
              properties:
                phone:
                  type: string
                  example: "0599123456"
                amount:
                  type: number
                  example: 50
                code:
                  type: string
                  example: "482913"
      responses:
        "201":
          description: "Created and completed immediately (`TopUpRequest` with status مكتمل)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /wallet/deduct:
    post:
      tags: [Wallet]
      summary: Deduct from wallet balance (payment by wallet)
      description: |
        **Not implemented yet (handoff 14).** Server is the sole authority
