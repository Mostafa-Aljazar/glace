openapi: 3.0.3
info:
  title: Glace API
  description: |
    API specification for the Glace storefront (Next.js) and Filament admin.

    **Source of truth for open backend work:** `docs/backend-handoff/`
    (`01` … `14` + README). This file encodes the agreed contract.

    ### Net-new: Auth/Account/Addresses/Cart/Orders/Payments/Wallet (handoff 08-14)
    Everything under the `Auth`, `Account`, `Addresses`, `Cart`, `Orders`,
    `Payments`, and `Wallet` tags below is **not implemented on any backend
    yet** — the frontend currently runs entirely on local state (zustand +
    localStorage) for these systems. This is net-new endpoint work, not a
    fix to an existing integration. See `docs/backend-handoff/08` … `14` for
    full context per system, and `docs/frontend-integration-plan.md` for the
    frontend-side migration plan once these are live.

    Auth has fully moved to **phone/OTP** — there is no password anywhere in
    the current frontend. Any password-based schema in an older version of
    this file is stale and superseded by `AuthOtpSendRequest` /
    `AuthOtpVerifyRequest` below.

    ### Media URLs (handoff 01 · 03 · 04)
    Every image field (`format: uri`) MUST be an **absolute** URL from
    `Storage::disk('public')->url(...)` (or a real CDN), e.g.
    `https://host/storage/products/….png`.
    - Relative paths (`products/…`, `hero-slides/…`) are **rejected by contract**.
    - Dead hosts (`cdn.example.com`, `example.com`) are **rejected**.

    ### Dashboard-driven catalogs (handoff 05 · 07 · 01)
    Builder `containerOptions` / `sizes` / prices, flat-list `items` (+ images),
    and flat-list `mixes` are edited in Filament and reflected immediately on
    `GET /menu/products` and `GET /menu/products/{slug}`.

    ### Booleans
    Never drop `false` fields. Especially `flavors[].available` and
    `mixes[].available` — omit-when-false breaks the frontend parse.

    ### Brad-boza media (handoff 06)
    Product has a **single** hero `image`. Do **not** send `secondaryImage`
    or any companion cup/scoop asset.
  version: 1.1.0
  contact:
    name: Glace Team

servers:
  - url: http://acw348d983gr8x01lb5myd3x.64.176.172.179.sslip.io/api
    description: Current backend (NEXT_PUBLIC_API_URL)
  - url: https://glace-bzjj.onrender.com/api
    description: Staging (Render)
  - url: http://localhost:8000/api
    description: Backend API (local)
  # NOTE: never use `cdn.example.com` / `api.example.com` in live payloads.
  # Examples below use `cdn.glace.ps` as the intended production CDN shape;
  # storage absolute URLs (`…/storage/…`) are equally valid.

tags:
  - name: Home
    description: Home page content
  - name: Menu
    description: Menu categories and items
  - name: Events
    description: Events and promotions
  - name: Contact
    description: Contact and support forms
  - name: Auth
    description: |
      Phone/OTP authentication (handoff 08). Not implemented yet — see
      `docs/backend-handoff/08-auth-otp.md`.
  - name: Account
    description: |
      Profile read/update (handoff 09). Not implemented yet — see
      `docs/backend-handoff/09-account-profile.md`. Logout is client-side
      only (no endpoint) — see the handoff doc.
  - name: Addresses
    description: |
      Saved delivery addresses CRUD (handoff 10). Not implemented yet — see
      `docs/backend-handoff/10-addresses.md`.
  - name: Cart
    description: |
      Coupon validation (handoff 11). Not implemented yet — see
      `docs/backend-handoff/11-cart-coupons.md`. The cart itself stays
      client-side (zustand) until checkout.
  - name: Orders
    description: |
      Order creation, tracking, and delivery zones (handoff 12). Not
      implemented yet — see `docs/backend-handoff/12-orders.md`.
  - name: Payments
    description: |
      Merchant payment accounts for manual bank transfer (handoff 13). Not
      implemented yet — see `docs/backend-handoff/13-payments.md`.
  - name: Wallet
    description: |
      Wallet balance, top-up requests, and deduction (handoff 14). Not
      implemented yet — see `docs/backend-handoff/14-wallet.md`.
  - name: Help
    description: |
      FAQ list for the help page (handoff 15). Not implemented yet — see
      `docs/backend-handoff/15-help-faqs.md`.
  - name: Terms
    description: |
      Terms-and-conditions HTML content (handoff 16). Not implemented yet —
      see `docs/backend-handoff/16-terms-content.md`.
  - name: Privacy
    description: |
      Privacy-policy HTML content (handoff 17). Not implemented yet — see
      `docs/backend-handoff/17-privacy-content.md`.

paths:
  /home:
    get:
      tags: [Home]
      summary: Get home page content
      description: |
        Public aggregate endpoint for the entire home page.
        Returns hero slides, about, why-glace, branches, and events
        in a single response so the frontend can load the page with one request.

        **Contract notes (handoff 04):**
        - All image fields = absolute URLs (`Storage::url` / real CDN).
        - `about.paragraphs` = `string[]` (NOT `[{ "text": "..." }]`).
        - `events.items` length up to **10** (latest first), each with a real
          card image when available.
        - `whyGlace.features[]` = `{ label }` only — do not send `image`.
      operationId: getHomePage
      security: []
      responses:
        "200":
          description: Home page content (`IHomePageData`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IHomePageData"
              example:
                hero:
                  slides:
                    - manImg: https://cdn.glace.ps/home/hero/man-1.png
                      pieceImg: https://cdn.glace.ps/home/hero/piece-1.png
                      zigzagsImg: https://cdn.glace.ps/home/hero/zigzags.png
                      titleH1: جلاسية الأمير
                      titleH2: لإنتاج الآيس كريم و البراد و العصائر و الحلويات
                      bgColor: "#51C9F4"
                      headerBgColor: "#51c9f4"
                      h1BgColor: "#53352a"
                      h2BgColor: "#51c9f4"
                about:
                  title: موهوبون في صناعة الأيسكريم !
                  paragraphs:
                    - تأسس جلاسيه الأمير عام 2015 كأحد أفرع شركة أسكمو الأمير...
                    - تعمل الشركة على تقديم أجود أنواع الآيس كريم والبراد...
                  image: https://cdn.glace.ps/home/about/character.png
                  ctaLabel: اعرف أكثر
                  ctaHref: /about
                whyGlace:
                  title: لماذا جلاسيه الأمير؟
                  description: جلاسيه الأمير حاصلة على شهادة الجودة العالمية لسلامة الغذاء ISO 22000
                  features:
                    - label: جودة عالية
                    - label: أمانة وثقة
                  videoUrl: https://www.youtube.com/embed/ShMr0XzIqSM
                  videoThumbnail: https://cdn.glace.ps/home/why/video-thumb.png
                branches:
                  title: ننتظركم في المواعيد التالية
                  branches:
                    - id: ramal
                      label: فرع الرمال
                      mapSrc: https://www.google.com/maps/embed?...
                      address: غزة، الرمال، شارع الشهداء...
                      phone: "0592 226 522"
                      whatsapp: "0592 226 522"
                      weekdayHours: "PM 11:45 – AM 10:00"
                      fridayHours: "PM 11:45 – PM02:00"
                      borderRadius: "32% 68% 69% 31% / 30% 28% 72% 70%"
                events:
                  title: الفعاليات و المناسبات
                  moreLabel: عرض المزيد
                  moreHref: /events
                  items:
                    - id: 1
                      title: مشارك معرض الصناعات الغذائية الفلسطينية
                      image: https://cdn.glace.ps/home/events/1.png
                      href: /events/1
        "500":
          $ref: "#/components/responses/ServerError"

  /events:
    get:
      tags: [Events]
      summary: List events
      description: |
        Public paginated list of events for `/events`.
        Matches TypeScript `IEventsListResponse` / `IEvent`.

        **Contract (handoff 04):** every listed event SHOULD have a non-null
        `listImage` absolute URL. `images` must be a string array with **no
        `null` entries** (empty `[]` if no gallery yet).
      operationId: getEvents
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
          example: 8
      responses:
        "200":
          description: Paginated events list (`IEventsListResponse`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IEventsListResponse"
              example:
                items:
                  - id: 2
                    title: أجواء العيد مع جلاسيه غير
                    date: "11/06/2020"
                    description: كل عام وانتم بخير بحلول عيد الفطر المبارك...
                    listImage: https://cdn.glace.ps/events/2-list.png
                    images:
                      - https://cdn.glace.ps/events/2-a.png
                      - https://cdn.glace.ps/events/2-b.png
                total: 10
                page: 1
                perPage: 8
                totalPages: 2
        "500":
          $ref: "#/components/responses/ServerError"

  /events/{id}:
    get:
      tags: [Events]
      summary: Get event by id
      description: |
        Public event detail for `/events/{id}`.
        Matches TypeScript `IEvent`.

        **Contract (handoff 04):** `images` is the detail gallery — absolute
        URL strings only. Never return `[null, null, …]`. Manage uploads from
        Filament (multi-file / repeater), not card image alone.
      operationId: getEventById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 2
      responses:
        "200":
          description: Event detail (`IEvent`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IEvent"
              example:
                id: 2
                title: أجواء العيد مع جلاسيه غير
                date: "11/06/2020"
                description: كل عام وانتم بخير بحلول عيد الفطر المبارك احتفالنا معكم بالعيد أجمل...
                listImage: https://cdn.glace.ps/events/2-list.png
                images:
                  - https://cdn.glace.ps/events/2-a.png
                  - https://cdn.glace.ps/events/2-b.png
                  - https://cdn.glace.ps/events/2-c.png
                  - https://cdn.glace.ps/events/2-d.png
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /contact:
    post:
      tags: [Contact]
      summary: Send contact message
      description: |
        Public contact form submission.
        Matches TypeScript `IContactRequest` → `IContactResponse`.
      operationId: sendContactMessage
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IContactRequest"
            example:
              name: أحمد علي
              phone: "0592123456"
              email: ahmed@example.com
              message: أريد الاستفسار عن العروض الحالية
      responses:
        "200":
          description: Message accepted (`IContactResponse`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IContactResponse"
              example:
                success: true
                message: تم إرسال رسالتك بنجاح
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /menu/categories:
    get:
      tags: [Menu]
      summary: List menu categories
      description: |
        Public list of browse-grid category tabs for `/menu`.
        Matches TypeScript `IMenuCategory`.
      operationId: getMenuCategories
      security: []
      responses:
        "200":
          description: Menu categories (`IMenuCategory[]`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IMenuCategory"
              example:
                - id: pancake
                  label: بان كيك
                  icon: cake
                  accentColor: "#f4a851"
                  gradientFrom: "#f4a851"
                  gradientTo: "#c97d2a"
                  sortOrder: 11
        "500":
          $ref: "#/components/responses/ServerError"

  /menu/products:
    get:
      tags: [Menu]
      summary: List products
      description: |
        Public list of orderable/reference products, optionally filtered by
        category. Matches TypeScript `IProduct` — a discriminated union on
        `kind` (`builder` | `flat-list`).

        **Contract (handoff 01 · 02 · 03 · 05 · 07):**
        - Filter query is **`category`** (= `IMenuCategory.id`). Do **not**
          treat `categoryId` as a silent alias — return **422** (or ignore
          explicitly). Never return the full unfiltered catalog when a wrong
          filter key was sent as if filtering succeeded.
        - List rows MUST **omit** `flavors[]` (detail-only).
        - Flat-list `items[].image` is **required** on every item.
        - Builder `containerOptions` / `sizes` and flat-list `mixes` are
          Filament-managed and must round-trip here.
      operationId: getMenuProducts
      security: []
      parameters:
        - name: category
          in: query
          required: false
          description: |
            Filter by `IMenuCategory.id`. Wrong key `categoryId` is not
            supported — respond 422 ValidationError (handoff 03).
          schema:
            type: string
          example: pancake
      responses:
        "200":
          description: Products (`IProduct[]`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IProduct"
              example:
                - id: "a1c3e5f7-1111-4b22-9c33-aa44bb55cc66"
                  slug: pancake
                  categoryId: pancake
                  kind: flat-list
                  name: بان كيك
                  description: بان كيك طازج بنكهات متنوعة
                  image: https://cdn.glace.ps/menu/pancake.jpg
                  sortOrder: 1
                  available: true
                  inStoreOnly: true
                  hasFavorites: true
                  hasNotes: true
                  addons:
                    - id: extra-nutella
                      label: صوص نوتيلا إضافي
                      price: 4
                      available: true
                    - id: extra-nuts
                      label: بندق مبشور
                      price: 4
                      available: true
                  items:
                    - id: nutella
                      label: نوتيلا
                      price: 11
                      available: true
                      description: بان كيك بصوص النوتيلا
                      image: https://cdn.glace.ps/menu/pancake-nutella.jpg
                    - id: lotus
                      label: لوتس
                      price: 13
                      available: true
                      image: https://cdn.glace.ps/menu/pancake-lotus.jpg
                    - id: pistachio
                      label: بيستاشيو
                      price: 17
                      available: true
                      isPremiumMixFlavor: true
                      image: https://cdn.glace.ps/menu/pancake-pistachio.jpg
                  mixes:
                    - id: mix
                      label: مكس (اختر طعمين)
                      available: true
                      pick: 2
                      basePrice: 14
                      flavorPrice: 7
                      premiumFlavorPrice: 11
                      itemIds: [nutella, lotus, pistachio]
                - id: "b7f1c2a4-9e3d-4a10-8c21-3f5a2d1e9b04"
                  slug: cup
                  categoryId: ice-cream
                  kind: builder
                  name: بوظة كاسة
                  image: https://cdn.glace.ps/menu/cup.jpg
                  sortOrder: 1
                  available: true
                  selectionMode: repeatable
                  flavorFamilies: [classic, special, mix]
                  hasExtraBiscuitAddon: true
                  containerOptions:
                    - id: cup
                      label: كاسة
                      available: true
                    - id: biscuit
                      label: بسكوت
                      available: true
                      name: بوظة بسكوت
                      image: https://cdn.glace.ps/menu/biscuit.jpg
                  sizes:
                    - id: cup-small
                      label: صغير
                      maxBalls: 1
                      containerId: cup
                      prices:
                        - flavorFamily: classic
                          price: 2
                        - flavorFamily: special
                          price: 4
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /menu/products/{slug}:
    get:
      tags: [Menu]
      summary: Get product by slug
      description: |
        Public product detail for `/menu/order/{type}` — looked up by the
        product's **`slug`** column (route-model-bind on `slug`, NOT the
        primary key). In Laravel: `Route::get('products/{product:slug}', ...)`.
        The response's `id` is still the internal PK to send back when
        POSTing cart/order data. Matches TypeScript `IProduct`.

        **Contract (handoff 02 · 05 · 06 · 07):**
        - Builder products with a flavor step (`cup`, `family`, `brad-boza`)
          MUST include `flavors[]`; every flavor includes `available` even when
          `false`. List endpoint omits `flavors`.
        - `family` detail MUST return a non-empty `flavors[]`.
        - Brad-boza: single product `image` only — **no** `secondaryImage`.
          `pricingLabel` may already include «أسعار» (frontend does not
          double-prefix).
        - `containerOptions` / `sizes` / `iceCreamAddonPrices` / `mixes` are
          Filament CRUD surfaces; changes appear here without a frontend deploy.
      operationId: getMenuProductBySlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: Stable URL-safe identifier (`IProductBase.slug`)
          schema:
            type: string
          example: cup
      responses:
        "200":
          description: Product detail (`IProduct`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IProduct"
              example:
                id: "b7f1c2a4-9e3d-4a10-8c21-3f5a2d1e9b04"
                slug: cup
                categoryId: ice-cream
                kind: builder
                name: بوظة كاسة
                image: https://cdn.glace.ps/menu/cup.jpg
                sortOrder: 1
                available: true
                selectionMode: repeatable
                flavorFamilies: [classic, special, mix]
                hasExtraBiscuitAddon: true
                containerOptions:
                  - id: cup
                    label: كاسة
                    available: true
                    pricingLabel: الكاسة
                  - id: biscuit
                    label: بسكوت
                    available: true
                    name: بوظة بسكوت
                    image: https://cdn.glace.ps/menu/biscuit.jpg
                    pricingLabel: البسكوت
                sizes:
                  - id: cup-small
                    label: صغير
                    maxBalls: 1
                    containerId: cup
                    prices:
                      - flavorFamily: classic
                        price: 2
                      - flavorFamily: special
                        price: 4
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /menu/addons:
    get:
      tags: [Menu]
      summary: List additions catalog
      description: |
        Public shared additions (إضافات) catalog — the per-unit extras a
        customer can attach to a cart line (e.g. sauces, nuts, biscuit), each
        with its own price. Applied to any product in the cart's
        "تخصيص الإضافات" flow. A product MAY override this shared list with its
        own `IProductBase.addons`. Matches TypeScript `IAddonOption[]`.
      operationId: getMenuAddons
      security: []
      responses:
        "200":
          description: Additions catalog (`IAddonOption[]`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IAddonOption"
              example:
                - id: extra-biscuit
                  label: بسكوت مخروط
                  price: 3
                  available: true
                  type: counter
                  maxQty: 10
                - id: extra-caramel
                  label: صوص كراميل
                  price: 3
                  available: true
                  type: toggle
                - id: extra-nuts
                  label: بندق مبشور
                  price: 4
                  available: true
                  type: toggle
        "500":
          $ref: "#/components/responses/ServerError"

  # --- Auth (handoff 08) — NOT IMPLEMENTED YET ---
  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Send OTP code to a phone number
      description: |
        **Not implemented yet (handoff 08).** Sends a one-time code via SMS.
        Register vs. login is not distinguished here — verify decides.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthOtpSendRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Rate limited — too many OTP requests for this phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP code and authenticate
      description: |
        **Not implemented yet (handoff 08).** `fullName` is required only on
        first-time registration; omit for an existing user's login.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthOtpVerifyRequest"
      responses:
        "200":
          description: Authenticated (`AuthOtpResponse`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOtpResponse"
        "422":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/ServerError"
        "500":
          $ref: "#/components/responses/ServerError"

  # --- Account (handoff 09) — NOT IMPLEMENTED YET ---
  /auth/me:
    get:
      tags: [Account]
      summary: Get current authenticated user
      description: "**Not implemented yet (handoff 09).**"
      operationId: getMe
      responses:
        "200":
          description: Current user (`AuthUser`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/profile:
    put:
      tags: [Account]
      summary: Update current user's profile
      description: "**Not implemented yet (handoff 09).** `name` and `email` required; `phone` optional."
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user (`AuthUser`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  # --- Addresses (handoff 10) — NOT IMPLEMENTED YET ---
  /addresses:
    get:
      tags: [Addresses]
      summary: List current user's saved addresses
      description: "**Not implemented yet (handoff 10).**"
      operationId: getAddresses
      responses:
        "200":
          description: Saved addresses (`SavedAddress[]`)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Addresses]
      summary: Add a new saved address
      description: "**Not implemented yet (handoff 10).**"
      operationId: addAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
      responses:
        "201":
          description: Created (`SavedAddress`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /addresses/{id}:
    put:
      tags: [Addresses]
      summary: Update a saved address
      description: "**Not implemented yet (handoff 10).**"
      operationId: updateAddress
      parameters:
