openapi: 3.0.3
info:
  title: Glace API
  version: 2.0.0
  description: |
    The endpoints the Glace storefront (this Next.js app) actually calls, with
    request and response shapes taken from its TypeScript types.

    Each operation names the frontend file that calls it, so the spec and
    the code can be checked against each other.

    ### Authentication
    Signed-in calls send the token from `POST /auth/otp/verify` in the
    `Authorization` header **as is**, with no `Bearer ` prefix added by the
    frontend (see `src/lib/axios.ts`).

    ### Wire names that differ from the frontend
    The frontend uses `paypal` for بال باي; the API uses `palpay`. The
    frontend translates at the network boundary for top-up requests, wallet
    transactions, payment accounts and `POST /orders`.

    ### Images
    Image fields are absolute URLs (or `null` where noted). The frontend
    also accepts storage-relative paths and resolves them against the API
    origin, but absolute URLs are the contract.
servers:
  - url: /backend-api
    description: Same-origin proxy used by the browser (rewritten to the API by next.config.ts)
  - url: https://back.glaceelameer.com/api
    description: Production API (NEXT_PUBLIC_API_URL)

tags:
  - name: Home
  - name: Events
  - name: Contact
  - name: Menu
  - name: Store
  - name: Auth
  - name: Addresses
  - name: Cart
  - name: Orders
  - name: Payments
  - name: Wallet
  - name: Content

paths:
  # ───────────────────────────── Home ─────────────────────────────
  /home:
    get:
      tags: [Home]
      summary: Full home page content in one request
      description: "Called by `src/hooks/home/fetchHomePage.ts`."
      operationId: getHomePage
      responses:
        "200":
          description: Home page payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePage"

  # ───────────────────────────── Events ─────────────────────────────
  /events:
    get:
      tags: [Events]
      summary: Paginated events
      description: "Called by `src/hooks/events/fetchEvents.ts` (default `perPage` is 8)."
      operationId: listEvents
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsPage"

  /events/{id}:
    get:
      tags: [Events]
      summary: One event
      description: "Called by `src/hooks/events/fetchEventById.ts`. A 404 is shown as \"not found\"; any other failure as an error."
      operationId: getEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"

  # ───────────────────────────── Contact ─────────────────────────────
  /contact:
    post:
      tags: [Contact]
      summary: Send a contact form message
      description: "Called by `src/hooks/contact/sendContactMessage.ts`. A response with `success: false` is treated as a failure and its `message` is shown."
      operationId: sendContactMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: Delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────── Menu ─────────────────────────────
  /menu/categories:
    get:
      tags: [Menu]
      summary: Menu categories
      description: "Called by `src/hooks/menu/fetchMenuCategories.ts`. Categories with `available: false` are hidden."
      operationId: listMenuCategories
      responses:
        "200":
          description: All categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuCategory"

  /menu/products:
    get:
      tags: [Menu]
      summary: Products, optionally filtered by category
      description: |
        Called by `src/hooks/menu/fetchMenuProducts.ts`. The frontend calls
        it without `category` to get every product in one request.
        List items omit `flavors`; those only come with `GET /menu/products/{slug}`.
      operationId: listMenuProducts
      parameters:
        - name: category
          in: query
          required: false
          description: A `MenuCategory.id`
          schema:
            type: string
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /menu/products/{slug}:
    get:
      tags: [Menu]
      summary: One product, with its builder flavors inline
      description: |
        Called by `src/hooks/menu/fetchMenuProductById.ts`. The API currently
        answers an unknown slug with `200 {}`; the frontend treats an empty
        body the same as a 404.
      operationId: getMenuProduct
      parameters:
        - name: slug
          in: path
          required: true
          description: "`Product.slug`, e.g. `cup`, `family`, `waffle`"
          schema:
            type: string
      responses:
        "200":
          description: The product (or `{}` when the slug is unknown)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /menu/addons:
    get:
      tags: [Menu]
      summary: Shared addon catalog
      description: "Called by `src/hooks/menu/fetchMenuAddons.ts`. Includes the `extra-biscuit` addon used by builder products."
      operationId: listMenuAddons
      responses:
        "200":
          description: All addons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddonOption"

  # ───────────────────────────── Store ─────────────────────────────
  /store/status:
    get:
      tags: [Store]
      summary: Whether the store and delivery are open now, with schedules
      description: "Called by `src/hooks/store/fetchStoreStatus.ts`."
      operationId: getStoreStatus
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatus"

  # ───────────────────────────── Auth ─────────────────────────────
  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Text a login code to a phone number
      description: "Called by `useSendOtp` in `src/hooks/auth/useOtpAuth.ts`."
      operationId: sendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpSendRequest"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSendResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify the code and sign in (or sign up)
      description: |
        Called by `useVerifyOtp` in `src/hooks/auth/useOtpAuth.ts`.
        `fullName` is sent for new users (`userExists: false` from the send step).
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      description: "Called by `src/hooks/auth/useMe.ts`."
      operationId: getMe
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/profile:
    put:
      tags: [Auth]
      summary: Update the signed-in user's profile
      description: "Called by `src/hooks/auth/useUpdateProfile.ts`."
      operationId: updateProfile
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────── Addresses ─────────────────────────────
  /addresses:
    get:
      tags: [Addresses]
      summary: The user's saved addresses
      description: |
        Called by `src/hooks/addresses/fetchAddresses.ts`. The API currently
        omits `area`, `zoneDescription` and `fee`; the frontend fills them in
        from `GET /addresses/delivery-zones` by `zoneId`.
      operationId: listAddresses
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Saved addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Addresses]
      summary: Save a new address
      description: "Called by `src/hooks/addresses/useAddAddress.ts`."
      operationId: createAddress
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: The saved address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedAddress"
        "201":
          description: The saved address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /addresses/{id}:
    parameters:
      - $ref: "#/components/parameters/AddressId"
    put:
      tags: [Addresses]
      summary: Update a saved address
      description: "Called by `src/hooks/addresses/useUpdateAddress.ts`."
      operationId: updateAddress
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: The updated address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Addresses]
      summary: Delete a saved address
      description: "Called by `src/hooks/addresses/useDeleteAddress.ts`. The response body is ignored."
      operationId: deleteAddress
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Deleted
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /addresses/{id}/default:
    parameters:
      - $ref: "#/components/parameters/AddressId"
    post:
      tags: [Addresses]
      summary: Make an address the default one
      description: "Called by `src/hooks/addresses/useSetDefaultAddress.ts`. No request body."
      operationId: setDefaultAddress
      security:
        - TokenAuth: []
      responses:
        "200":
          description: The address, now default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /addresses/delivery-zones:
    get:
      tags: [Addresses]
      summary: Delivery zones with their fees
      description: "Called by `src/lib/deliveryZones.ts` without a token."
      operationId: listDeliveryZones
      responses:
        "200":
          description: All zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryZone"

  # ───────────────────────────── Cart ─────────────────────────────
  /cart/apply-coupon:
    post:
      tags: [Cart]
      summary: Check a coupon against the cart subtotal
      description: "Called by `src/hooks/cart/applyCouponRequest.ts`."
      operationId: applyCoupon
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyCouponRequest"
      responses:
        "200":
          description: "Coupon result (`valid: false` for an unknown or expired code)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyCouponResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────── Orders ─────────────────────────────
  /orders:
    get:
      tags: [Orders]
      summary: The user's orders, newest first
      description: "Called by `src/hooks/orders/fetchOrders.ts` (default `perPage` is 20)."
      operationId: listOrders
      security:
        - TokenAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Orders]
      summary: Place an order
      description: |
        Called by `src/hooks/orders/usePlaceOrder.ts`. Sent as
        `multipart/form-data` so a receipt photo can be attached as a file.
        `items` is a JSON-encoded array.
      operationId: placeOrder
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
            encoding:
              items:
                contentType: application/json
              receiptImage:
                contentType: image/*
      responses:
        "200":
          description: The created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "201":
          description: The created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orders/jawwal/send-code:
    post:
      tags: [Orders]
      summary: Ask JawwalPay to text a payment code for an order
      description: |
        Called by `src/hooks/orders/useSendJawwalOrderCode.ts`. `amount` is the
        live order total. The phone and code are then sent with `POST /orders`
        as `jawwalPhone` and `jawwalCode`.
      operationId: sendJawwalOrderCode
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JawwalSendCodeRequest"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [Orders]
      summary: One order
      description: "Called by `src/hooks/orders/fetchOrderById.ts`."
      operationId: getOrder
      security:
        - TokenAuth: []
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [Orders]
      summary: Cancel an order
      description: "Called by `src/hooks/orders/useCancelOrder.ts`."
      operationId: cancelOrder
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "200":
          description: The cancelled order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orders/{id}/receipt:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [Orders]
      summary: Replace an order's transfer receipt
      description: "Called by `src/hooks/orders/useUpdateReceipt.ts`. Sent as `multipart/form-data`."
      operationId: updateOrderReceipt
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateReceiptRequest"
            encoding:
              receiptImage:
                contentType: image/*
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /orders/{id}/received:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [Orders]
      summary: Mark a delivered order as received by the customer
      description: "Called by `src/hooks/orders/useMarkReceived.ts`. No request body."
      operationId: markOrderReceived
      security:
        - TokenAuth: []
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/email-summary:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [Orders]
      summary: Email the order summary to any address
      description: "Called by `src/hooks/orders/useEmailOrderSummary.ts`. The address is typed by the customer and need not be the account email."
      operationId: emailOrderSummary
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSummaryRequest"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────── Payments ─────────────────────────────
  /payment-accounts:
    get:
      tags: [Payments]
      summary: The store's receiving accounts per payment method
      description: |
        Called by `src/lib/merchantPaymentAccounts.ts` without a token. The
        frontend maps `palpay` to `paypal`, `primaryLabel`/`primaryValue` to
        its account label/value, and `secondaryValue` to the IBAN.
      operationId: listPaymentAccounts
      responses:
        "200":
          description: One entry per payment method
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentAccount"

  # ───────────────────────────── Wallet ─────────────────────────────
  /wallet:
    get:
      tags: [Wallet]
      summary: Wallet balance
      description: "Called by `src/hooks/wallet/fetchWallet.ts`."
      operationId: getWallet
      security:
        - TokenAuth: []
      responses:
        "200":
          description: Balance in ILS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: Paginated wallet transactions
      description: "Called by `src/hooks/wallet/fetchWalletTransactions.ts` (default `perPage` is 20)."
      operationId: listWalletTransactions
      security:
        - TokenAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: One page of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransactionsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wallet/topup-requests:
    get:
      tags: [Wallet]
      summary: The user's top-up requests
      description: "Called by `src/hooks/wallet/fetchTopUpRequests.ts`."
      operationId: listTopUpRequests
      security:
        - TokenAuth: []
      responses:
        "200":
          description: All top-up requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpRequestsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Wallet]
      summary: Submit a receipt-based top-up request
      description: |
        Called by `src/hooks/wallet/useSubmitTopUpRequest.ts`. Only for the
        receipt methods; automatic JawwalPay uses the `jawwal/*` endpoints below.
        The request starts as `قيد المراجعة` until staff check the receipt.
      operationId: submitTopUpRequest
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SubmitTopUpRequest"
            encoding:
              receiptImage:
                contentType: image/*
      responses:
        "200":
          description: The created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpRequestResponse"
        "201":
          description: The created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /wallet/topup-requests/jawwal/send-code:
    post:
      tags: [Wallet]
      summary: Step 1 of an automatic JawwalPay top-up (text a code)
      description: "Called by `useSendJawwalTopUpCode` in `src/hooks/wallet/useJawwalTopUp.ts`."
      operationId: sendJawwalTopUpCode
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JawwalSendCodeRequest"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /wallet/topup-requests/jawwal/confirm:
    post:
      tags: [Wallet]
      summary: Step 2 of an automatic JawwalPay top-up (verify the code)
      description: |
        Called by `useConfirmJawwalTopUp` in `src/hooks/wallet/useJawwalTopUp.ts`.
        A correct code credits the balance at once, so the request comes back
        already `مكتمل`.
      operationId: confirmJawwalTopUp
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JawwalConfirmRequest"
      responses:
        "200":
          description: The completed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /wallet/deduct:
    post:
      tags: [Wallet]
      summary: Pay from the wallet balance
      description: |
        Called by `src/hooks/wallet/useDeductWallet.ts` when an order is paid
        with `wallet`. The frontend refetches `GET /wallet` first and stops if
        the balance is lower than `amount`.
      operationId: deductWallet
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeductWalletRequest"
      responses:
        "200":
          description: The new balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ───────────────────────────── Content ─────────────────────────────
  /help/faqs:
    get:
      tags: [Content]
      summary: Help page FAQs
      description: "Called by `src/hooks/help/fetchHelpFaqs.ts`."
      operationId: listHelpFaqs
      responses:
        "200":
          description: All FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faq"

  /terms:
    get:
      tags: [Content]
      summary: Terms and conditions as an HTML fragment
      description: "Called by `src/hooks/terms/fetchTermsContent.ts`. The body is a JSON string holding HTML, sanitized by the frontend before rendering."
      operationId: getTerms
      responses:
        "200":
          description: HTML fragment
          content:
            application/json:
              schema:
                type: string
                example: "<h3>الشروط والأحكام</h3><p>…</p>"

  /privacy:
    get:
      tags: [Content]
      summary: Privacy policy as an HTML fragment
      description: "Called by `src/hooks/privacy/fetchPrivacyContent.ts`. The body is a JSON string holding HTML, sanitized by the frontend before rendering."
      operationId: getPrivacy
      responses:
        "200":
          description: HTML fragment
          content:
            application/json:
              schema:
                type: string
                example: "<h3>سياسة الخصوصية</h3><p>…</p>"

components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "The `token` from `POST /auth/otp/verify`, sent exactly as received."

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    AddressId:
      name: id
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Rejected input; `message` is shown to the customer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many attempts; the frontend shows its own wait message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      description: The frontend only reads `message`.
      required: [message]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    # ───────────── Home (src/types/home.types.ts) ─────────────
    HomeImage:
      type: string
      nullable: true
      description: Image URL, or `null` when nothing is uploaded (the frontend shows a placeholder)
    HeroSlide:
      type: object
      required: [manImg, pieceImg, zigzagsImg, titleH1, titleH2, bgColor, headerBgColor, h1BgColor, h2BgColor]
      properties:
        manImg:
          $ref: "#/components/schemas/HomeImage"
        pieceImg:
          $ref: "#/components/schemas/HomeImage"
        zigzagsImg:
          $ref: "#/components/schemas/HomeImage"
        titleH1:
          type: string
        titleH2:
          type: string
        bgColor:
          type: string
        headerBgColor:
          type: string
        h1BgColor:
          type: string
        h2BgColor:
          type: string
    HomeAbout:
      type: object
      required: [title, paragraphs, image, ctaLabel, ctaHref]
      properties:
        title:
          type: string
        paragraphs:
          type: array
          items:
            type: string
        image:
          $ref: "#/components/schemas/HomeImage"
        ctaLabel:
          type: string
        ctaHref:
          type: string
    HomeWhyFeature:
      type: object
      required: [label]
      properties:
        label:
          type: string
    HomeWhyGlace:
      type: object
      required: [title, description, features, videoUrl, videoThumbnail]
      properties:
        title:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            $ref: "#/components/schemas/HomeWhyFeature"
        videoUrl:
          type: string
        videoThumbnail:
          $ref: "#/components/schemas/HomeImage"
    HomeBranch:
      type: object
      required: [id, label, mapSrc, address, phone, whatsapp, weekdayHours, fridayHours, borderRadius]
      properties:
        id:
          type: string
        label:
          type: string
        mapSrc:
          type: string
          description: "Google Maps embed URL (`https://www.google.com/maps/embed?pb=...`)"
        address:
          type: string
        phone:
          type: string
        whatsapp:
          type: string
        weekdayHours:
          type: string
          description: Free text, e.g. `PM 10:30 – AM 11:00` (Saturday to Thursday)
        fridayHours:
          type: string
        borderRadius:
          type: string
          description: CSS border-radius for the map frame
        available:
          type: boolean
          description: Absent means available
    HomeBranches:
      type: object
      required: [title, branches]
      properties:
        title:
          type: string
        branches:
          type: array
          items:
            $ref: "#/components/schemas/HomeBranch"
    HomeEvent:
      type: object
      required: [id, title, image, href]
      properties:
        id:
          type: integer
        title:
          type: string
        image:
          $ref: "#/components/schemas/HomeImage"
        href:
          type: string
    HomeEvents:
      type: object
      required: [title, items, moreLabel, moreHref]
      properties:
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/HomeEvent"
        moreLabel:
          type: string
        moreHref:
          type: string
    HomePage:
      type: object
      required: [hero, about, whyGlace, branches, events]
      properties:
        hero:
          type: object
          required: [slides]
          properties:
            slides:
              type: array
              items:
                $ref: "#/components/schemas/HeroSlide"
        about:
          $ref: "#/components/schemas/HomeAbout"
        whyGlace:
          $ref: "#/components/schemas/HomeWhyGlace"
        branches:
          $ref: "#/components/schemas/HomeBranches"
        events:
          $ref: "#/components/schemas/HomeEvents"

    # ───────────── Events (src/types/events.types.ts) ─────────────
    EventImage:
      type: string
      nullable: true
    Event:
      type: object
      required: [id, title, date, description, listImage, images]
      properties:
        id:
          type: integer
        title:
          type: string
        date:
          type: string
          description: Shown as is on the page
        description:
          type: string
        listImage:
          $ref: "#/components/schemas/EventImage"
        images:
          type: array
          items:
            $ref: "#/components/schemas/EventImage"
    EventsPage:
      type: object
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        totalPages:
          type: integer

    # ───────────── Contact (src/types/contact.types.ts) ─────────────
    ContactRequest:
      type: object
      required: [name, phone, email, message]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        message:
          type: string
        subject:
          type: string
          description: Not on the current form
    ContactResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    # ───────────── Menu (src/types/menu.types.ts) ─────────────
    MenuImage:
      type: string
      nullable: true
    MenuCategory:
      type: object
      required: [id, label, icon, accentColor, gradientFrom, gradientTo, sortOrder]
      properties:
        id:
          type: string
          example: ice-cream
        label:
          type: string
        icon:
          type: string
          enum: [ice-cream, cup-soda, cake, glass-water, milk, apple]
        accentColor:
          type: string
        gradientFrom:
          type: string
        gradientTo:
          type: string
        sortOrder:
          type: integer
        available:
          type: boolean
          description: "Absent or `true` shows the category; `false` hides it"
    FlavorOption:
      type: object
      description: One flavor ball in the builder flow
      required: [id, nameAr, nameEn, image, family, available]
      properties:
        id:
          type: string
          example: pistachio
        nameAr:
          type: string
        nameEn:
          type: string
        image:
          $ref: "#/components/schemas/MenuImage"
        family:
          type: string
          enum: [classic, special, stevia]
        available:
          type: boolean
          description: "Must always be sent; a missing value is read as `false`"
        isPremiumMixFlavor:
          type: boolean
    ProductVariant:
      type: object
      description: One item of a flat-list product
      required: [id, label, price, available]
      properties:
        id:
          type: string
          description: Stable id; mixes reference items by it
        label:
          type: string
        price:
          type: number
        description:
          type: string
        image:
          $ref: "#/components/schemas/MenuImage"
        available:
          type: boolean
        isPremiumMixFlavor:
          type: boolean
          description: "Priced at the mix's `premiumFlavorPrice` inside a mix"
    AddonOption:
      type: object
      required: [id, label, price]
      properties:
        id:
          type: string
          example: extra-biscuit
        label:
          type: string
        price:
          type: number
          description: Surcharge in ILS per selected quantity
        available:
          type: boolean
        type:
          type: string
          enum: [toggle, counter]
          description: Defaults to `toggle`
        maxQty:
          type: integer
          description: Cap for `counter` addons
    MixRule:
      type: object
      required: [id, label, pick, basePrice, flavorPrice, premiumFlavorPrice, itemIds]
      properties:
        id:
          type: string
          example: mix
        label:
          type: string
          example: مكس
        pick:
          type: integer
          description: How many distinct items the customer picks
        basePrice:
          type: number
        flavorPrice:
          type: number
        premiumFlavorPrice:
          type: number
        itemIds:
          type: array
          description: "`ProductVariant.id`s of this product the mix can use"
          items:
            type: string
        available:
          type: boolean
          description: "Absent or `true` offers the mix"
    PriceCell:
      type: object
      required: [flavorFamily, price]
      properties:
        flavorFamily:
          type: string
          enum: [classic, special, mix]
        price:
          type: number
    SizeOption:
      type: object
      required: [id, label, maxBalls, prices]
      properties:
        id:
          type: string
        label:
          type: string
        maxBalls:
          type: integer
        prices:
          type: array
          items:
            $ref: "#/components/schemas/PriceCell"
        containerId:
          type: string
          description: Limits the size to one container; absent means every container
        available:
          type: boolean
          description: "Absent or `true` means orderable"
        image:
          $ref: "#/components/schemas/MenuImage"
    ContainerOption:
      type: object
      required: [id, label, available]
      properties:
        id:
          type: string
        label:
          type: string
        available:
          type: boolean
        name:
          type: string
          description: Overrides the product name when this container is picked
        image:
          $ref: "#/components/schemas/MenuImage"
        pricingLabel:
          type: string
    ExtraScoopOption:
      type: object
      required: [id, label, price, available]
      properties:
        id:
          type: string
        label:
          type: string
        price:
          type: number
        available:
          type: boolean
    ExtraScoop:
      type: object
      description: "\"أضف بوظة\" on flat-list items; either family may be absent"
      properties:
        classic:
          type: array
          items:
            $ref: "#/components/schemas/ExtraScoopOption"
        special:
          type: array
          items:
            $ref: "#/components/schemas/ExtraScoopOption"
    ProductBase:
      type: object
      required: [id, slug, categoryId, name, image, sortOrder, available, kind]
      properties:
        id:
          type: string
          description: Backend primary key, used in cart and orders
        slug:
          type: string
          description: "URL id, matches `/menu/order/{slug}`"
        categoryId:
          type: string
        name:
          type: string
        description:
          type: string
        image:
          $ref: "#/components/schemas/MenuImage"
        sortOrder:
          type: integer
        available:
          type: boolean
        kind:
          type: string
          enum: [builder, flat-list]
        hasAddons:
          type: boolean
        hasNotes:
          type: boolean
        addons:
          type: array
          items:
            $ref: "#/components/schemas/AddonOption"
        hasFavorites:
          type: boolean
        hasImageZoom:
          type: boolean
        inStoreOnly:
          type: boolean
    BuilderProduct:
      description: "Step-by-step products: cup, family, brad, brad-boza"
      allOf:
        - $ref: "#/components/schemas/ProductBase"
        - type: object
          required: [sizes]
          properties:
            kind:
              type: string
              enum: [builder]
            containerOptions:
              type: array
              items:
                $ref: "#/components/schemas/ContainerOption"
            includesIceCreamStep:
              type: boolean
            iceCreamAddonPrices:
              type: array
              items:
                $ref: "#/components/schemas/PriceCell"
            hasExtraBiscuitAddon:
              type: boolean
            pricingLabel:
              type: string
            sizes:
              type: array
              items:
                $ref: "#/components/schemas/SizeOption"
            selectionMode:
              type: string
              enum: [repeatable, toggle]
            flavorFamilies:
              type: array
              items:
                type: string
                enum: [classic, special, mix]
            flavors:
              type: array
              description: "Only on `GET /menu/products/{slug}`"
              items:
                $ref: "#/components/schemas/FlavorOption"
    FlatListProduct:
      description: "List products: waffle, crepe, kunafa, juices and the rest"
      allOf:
        - $ref: "#/components/schemas/ProductBase"
        - type: object
          required: [items]
          properties:
            kind:
              type: string
              enum: [flat-list]
            items:
              type: array
              items:
                $ref: "#/components/schemas/ProductVariant"
            mixes:
              type: array
              items:
                $ref: "#/components/schemas/MixRule"
            extraScoop:
              $ref: "#/components/schemas/ExtraScoop"
    Product:
      oneOf:
        - $ref: "#/components/schemas/BuilderProduct"
        - $ref: "#/components/schemas/FlatListProduct"
      discriminator:
        propertyName: kind
        mapping:
          builder: "#/components/schemas/BuilderProduct"
          flat-list: "#/components/schemas/FlatListProduct"

    # ───────────── Store (src/hooks/store/fetchStoreStatus.ts) ─────────────
    StoreSchedule:
      type: object
      required: [day, label, enabled, open, close, allDay]
      properties:
        day:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        open:
          type: string
        close:
          type: string
        allDay:
          type: boolean
    StoreStatusDetails:
      type: object
      required: [open, source, override, scheduleOpen, opensAt, closesAt, nextChangeAt, today]
      properties:
        open:
          type: boolean
        source:
          type: string
          enum: [schedule, override]
        override:
          type: boolean
          nullable: true
        scheduleOpen:
          type: boolean
        opensAt:
          type: string
          nullable: true
        closesAt:
          type: string
          nullable: true
        nextChangeAt:
          type: string
          nullable: true
        today:
          $ref: "#/components/schemas/StoreSchedule"
    StoreStatus:
      type: object
      required: [storeOpen, deliveryOpen, closedMessage, deliveryClosedMessage, autoConfirmMinutes, timezone, serverTime, store, delivery, schedule]
      properties:
        storeOpen:
          type: boolean
        deliveryOpen:
          type: boolean
        closedMessage:
          type: string
        deliveryClosedMessage:
          type: string
        autoConfirmMinutes:
          type: integer
        timezone:
          type: string
        serverTime:
          type: string
        store:
          $ref: "#/components/schemas/StoreStatusDetails"
        delivery:
          $ref: "#/components/schemas/StoreStatusDetails"
        schedule:
          type: object
          required: [store, delivery]
          properties:
            store:
              type: array
              items:
                $ref: "#/components/schemas/StoreSchedule"
            delivery:
              type: array
              items:
                $ref: "#/components/schemas/StoreSchedule"

    # ───────────── Auth (src/store/authStore.ts, src/hooks/auth/*) ─────────────
    AuthUser:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    OtpSendRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
    OtpSendResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          required: [userExists]
          properties:
            userExists:
              type: boolean
              description: "`false` means the verify step must send `fullName`"
    OtpVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
        fullName:
          type: string
    OtpVerifyResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
            user:
              $ref: "#/components/schemas/AuthUser"
    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    # ───────────── Addresses (src/store/addressStore.ts, src/lib/deliveryZones.ts) ─────────────
    AddressType:
      type: string
      enum: [home, work, other]
    AddressInput:
      type: object
      description: "`SavedAddress` without `id` and `isDefault`"
      required: [type, label, name, phone, city, zoneId, street]
      properties:
        type:
          $ref: "#/components/schemas/AddressType"
        label:
          type: string
          description: "Required when `type` is `other`"
        name:
          type: string
        phone:
          type: string
        city:
          type: string
        zoneId:
          type: string
          description: "A `DeliveryZone.id`"
        area:
          type: string
          description: Zone name
        zoneDescription:
          type: string
        fee:
          type: number
        street:
          type: string
        landmark:
          type: string
    SavedAddress:
      allOf:
        - $ref: "#/components/schemas/AddressInput"
        - type: object
          required: [id, isDefault]
          properties:
            id:
              type: string
            isDefault:
              type: boolean
    DeliveryZone:
      type: object
      required: [id, name, fee]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          description: Boundary streets or landmarks of the zone
        fee:
          type: number

    # ───────────── Cart (src/hooks/cart/applyCouponRequest.ts) ─────────────
    ApplyCouponRequest:
      type: object
      required: [code, subtotal]
      properties:
        code:
          type: string
        subtotal:
          type: number
    ApplyCouponResult:
      type: object
      required: [valid, discount]
      properties:
        valid:
          type: boolean
        discount:
          type: number
          description: Discount amount in ILS
        message:
          type: string
          nullable: true

    # ───────────── Orders (src/store/orderStore.ts, src/store/cartStore.ts) ─────────────
    PaymentMethod:
      type: string
      description: "Payment method as the frontend types it on `Order` (`paypal` is بال باي)"
      enum: [jawwal, jawwal-manual, paypal, cash, visa, wallet, bop]
    PaymentMethodWire:
      type: string
      description: "Payment method as sent on `POST /orders` (بال باي is `palpay`)"
      enum: [jawwal, jawwal-manual, palpay, cash, visa, wallet, bop]
    DeliveryMethod:
      type: string
      enum: [delivery, pickup, dine-in]
    OrderStatus:
      type: string
      enum: ["قيد المراجعة", "جاري التحضير", "جاهز للاستلام", "في الطريق", "تم التسليم", "تم الاستلام", "ملغي", "مسترد"]
    CartSelection:
      type: object
      required: [kind, id, label, qty, unitPrice]
      properties:
        kind:
          type: string
          enum: [flavor, mix, mixItem, addon]
          description: "`mixItem` is only sent back by the API for a mix flavor; the frontend sends `mix`"
        id:
          type: string
          description: Flavor, addon or mix item id
        label:
          type: string
        qty:
          type: integer
        unitPrice:
          type: number
          description: "`0` for flavors included in the base price"
    CartUnit:
      type: object
      required: [selections]
      properties:
        selections:
          type: array
          items:
            $ref: "#/components/schemas/CartSelection"
    CartItem:
      type: object
      required: [id, productId, name, selections, addonTotal, unitPrice, quantity]
      properties:
        id:
          type: string
          description: Cart line id
        productId:
          type: string
          description: "`Product.id`"
        name:
          type: string
        image:
          type: string
        size:
          type: string
        type:
          type: string
        container:
          type: string
        sizeId:
          type: string
          description: "`SizeOption.id` (builder products)"
        containerId:
          type: string
          description: "`ContainerOption.id` (builder products with a container step)"
        itemId:
          type: string
          description: "`ProductVariant.id` (flat-list, non-mix lines)"
        mixId:
          type: string
          description: "`MixRule.id` (mix lines)"
        mixItemIds:
          type: array
          description: "Picked `ProductVariant.id`s for a mix line, one per pick"
          items:
            type: string
        flavorFamily:
          type: string
          enum: [classic, special, mix]
        selections:
          type: array
          items:
            $ref: "#/components/schemas/CartSelection"
        addonTotal:
          type: number
          description: Per-unit addon cost
        unitPrice:
          type: number
        quantity:
          type: integer
        units:
          type: array
          description: "Per-unit addons; when present, `units.length` equals `quantity`"
          items:
            $ref: "#/components/schemas/CartUnit"
        flatSelections:
          type: array
          description: Addons priced once for the whole line (not per unit)
          items:
            $ref: "#/components/schemas/CartSelection"
        flatAddonTotal:
          type: number
    PlaceOrderItem:
      description: "A `CartItem` as sent inside `POST /orders`"
      allOf:
        - $ref: "#/components/schemas/CartItem"
        - type: object
          properties:
            flavorIds:
              type: array
              description: "Flavor and mix pick ids from `selections`, each repeated by its `qty`. Only sent when there is at least one"
              items:
                type: string
    OrderItemSelection:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [builder, flat, mix]
        sizeId:
          type: string
        containerId:
          type: string
        itemId:
          type: string
    OrderItem:
      allOf:
        - $ref: "#/components/schemas/CartItem"
        - type: object
          properties:
            selection:
              $ref: "#/components/schemas/OrderItemSelection"
    DeliveryAddress:
      type: object
      required: [name, phone, city, area, street]
      properties:
        name:
          type: string
        phone:
          type: string
        city:
          type: string
        area:
          type: string
        street:
          type: string
        landmark:
          type: string
        note:
          type: string
    Driver:
      type: object
      required: [id, name, phone]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        company:
          type: string
    Order:
      type: object
      required: [id, items, subtotal, discount, total, paymentMethod, deliveryMethod, status, createdAt]
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: number
        discount:
          type: number
        total:
          type: number
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        deliveryMethod:
          $ref: "#/components/schemas/DeliveryMethod"
        address:
          $ref: "#/components/schemas/DeliveryAddress"
        pickupTime:
          type: string
          description: "Dine-in time, e.g. `17:00`"
        scheduledFor:
          type: string
          description: "ISO datetime the `pickupTime` field of `POST /orders` becomes (delivery and pickup)"
        status:
          $ref: "#/components/schemas/OrderStatus"
        paymentStatus:
          type: string
          description: "Known values: pending, paid, failed, refunded"
        createdAt:
          type: string
        orderNote:
          type: string
        captainNote:
          type: string
        receiptImage:
          type: string
          description: Receipt image URL
        receiptNote:
          type: string
        senderAccountName:
          type: string
        cancelReason:
          type: string
        adminNotes:
          type: string
        driver:
          $ref: "#/components/schemas/Driver"
        driverAssignedAt:
          type: string
        preparationTime:
          type: integer
          description: Minutes (5 to 30)
        estimatedDeliveryTime:
          type: integer
          description: Minutes (10 to 25)
        receivedAt:
          type: string
    OrdersPage:
      type: object
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        totalPages:
          type: integer
    PlaceOrderRequest:
      type: object
      required: [items, paymentMethod, deliveryMethod]
      properties:
        items:
          type: string
          description: "JSON-encoded array of `PlaceOrderItem`"
        couponCode:
          type: string
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethodWire"
        deliveryMethod:
          $ref: "#/components/schemas/DeliveryMethod"
        addressId:
          type: string
          description: "A `SavedAddress.id`; needed for `delivery`"
        pickupTime:
          type: string
        captainNote:
          type: string
          description: Note for the delivery captain
        orderNote:
          type: string
          description: Note about the order itself
        receiptImage:
          type: string
          format: binary
          description: "Transfer receipt for `jawwal-manual`, `palpay` and `bop`"
        receiptNote:
          type: string
        senderAccountName:
          type: string
          description: "Name on the account the customer paid from; needed for `jawwal-manual`, `palpay` and `bop`"
        jawwalPhone:
          type: string
          description: "Needed for `jawwal`; from `POST /orders/jawwal/send-code`"
        jawwalCode:
          type: string
          description: "Needed for `jawwal`; the code JawwalPay texted"
    UpdateReceiptRequest:
      type: object
      properties:
        receiptImage:
          type: string
          format: binary
        receiptNote:
          type: string
        senderAccountName:
          type: string
    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    EmailSummaryRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    JawwalSendCodeRequest:
      type: object
      required: [phone, amount]
      properties:
        phone:
          type: string
        amount:
          type: number
    SentResponse:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean

    # ───────────── Payments (src/lib/merchantPaymentAccounts.ts) ─────────────
    PaymentAccount:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [jawwal, jawwal-manual, palpay, cash, visa, wallet, bop]
        displayName:
          type: string
        qrImage:
          type: string
        holderName:
          type: string
        bankName:
          type: string
          description: Bank transfer methods only
        primaryLabel:
          type: string
          example: رقم الحساب
        primaryValue:
          type: string
        secondaryLabel:
          type: string
        secondaryValue:
          type: string
          description: Read by the frontend as the IBAN
        accountNumber:
          type: string

    # ───────────── Wallet (src/store/walletStore.ts, src/hooks/wallet/*) ─────────────
    WalletBalance:
      type: object
      required: [balance]
      properties:
        balance:
          type: number
    TopUpMethodWire:
      type: string
      description: "Top-up method on the wire (بال باي is `palpay`)"
      enum: [bop, palpay, jawwal, jawwal-manual, visa]
    WalletTransaction:
      type: object
      required: [id, date, amount, type, label]
      properties:
        id:
          type: string
        date:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [credit, debit]
        label:
          type: string
        method:
          type: string
          enum: [bop, palpay, jawwal, jawwal-manual, visa, cash, wallet]
        receiptImage:
          type: string
    WalletTransactionsPage:
      type: object
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        totalPages:
          type: integer
    TopUpRequestStatus:
      type: string
      enum: ["قيد المراجعة", "مكتمل", "مرفوض"]
    TopUpRequest:
      type: object
      required: [id, amount, method, status, createdAt]
      properties:
        id:
          type: string
        amount:
          type: number
        method:
          $ref: "#/components/schemas/TopUpMethodWire"
        status:
          $ref: "#/components/schemas/TopUpRequestStatus"
        createdAt:
          type: string
        receiptImage:
          type: string
        receiptNote:
          type: string
        senderAccountName:
          type: string
        phone:
          type: string
          description: "Automatic `jawwal` only: the number the customer paid from"
        rejectionReason:
          type: string
          description: "Read by the frontend for `مرفوض` requests; not sent by the API yet"
    TopUpRequestsResponse:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/TopUpRequest"
    TopUpRequestResponse:
      type: object
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/TopUpRequest"
    SubmitTopUpRequest:
      type: object
      required: [method, amount]
      properties:
        method:
          type: string
          enum: [bop, palpay, jawwal-manual]
        amount:
          type: number
        receiptImage:
          type: string
          format: binary
        receiptNote:
          type: string
        senderAccountName:
          type: string
          description: Name on the account the customer paid from
    JawwalConfirmRequest:
      type: object
      required: [phone, amount, code]
      properties:
        phone:
          type: string
        amount:
          type: number
        code:
          type: string
    DeductWalletRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
        label:
          type: string

    # ───────────── Content (src/hooks/help/fetchHelpFaqs.ts) ─────────────
    Faq:
      type: object
      required: [id, question, answer]
      properties:
        id:
          type: string
        question:
          type: string
        answer:
          type: string
          description: 'Paragraphs separated by a blank line; a paragraph starting with "- " is a bullet list'
        link:
          type: object
          required: [href, label]
          properties:
            href:
              type: string
            label:
              type: string
