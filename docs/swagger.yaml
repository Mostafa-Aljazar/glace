      operationId: getTermsContent
      responses:
        "200":
          description: Raw HTML string (`text/plain` or `application/json` string body)
          content:
            application/json:
              schema:
                type: string
                example: "<h3>1. قبول الشروط</h3><p>...</p>"
        "500":
          $ref: "#/components/responses/ServerError"

  /privacy:
    get:
      tags: [Privacy]
      summary: Get privacy-policy HTML content
      description: |
        **Not implemented yet (handoff 17).** Static content today
        (hardcoded sections in the frontend) — moving it here lets support
        staff edit the privacy policy from Filament without a code deploy.

        Returns a single HTML string with all sections already formatted
        (`<h3>` headings, `<p>` paragraphs, `<ul><li>` lists, `<a>` links).
        The frontend renders it with `dangerouslySetInnerHTML` after running
        it through DOMPurify — sanitize on the backend too, but never treat
        that as a substitute for frontend sanitization.
      operationId: getPrivacyContent
      responses:
        "200":
          description: Raw HTML string (`text/plain` or `application/json` string body)
          content:
            application/json:
              schema:
                type: string
                example: "<h3>1. المعلومات التي نجمعها</h3><p>...</p>"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token from login. Sent as:
        `Authorization: <token>`
        (matches the frontend `userApi` axios interceptor)

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Something went wrong
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ["The email field is required."]

    # --- Auth (handoff 08) — phone/OTP, no passwords anywhere ---
    AuthOtpSendRequest:
      type: object
      description: Matches `useSendOtp` — not implemented yet (handoff 08)
      required: [phone]
      properties:
        phone:
          type: string
          example: "0599123456"

    AuthOtpVerifyRequest:
      type: object
      description: |
        Matches `useVerifyOtp` — not implemented yet (handoff 08). `fullName`
        is required only on first-time registration.
      required: [phone, code]
      properties:
        phone:
          type: string
          example: "0599123456"
        code:
          type: string
          example: "123456"
        fullName:
          type: string
          nullable: true
          example: أحمد علي

    AuthOtpResponse:
      type: object
      description: Not implemented yet (handoff 08)
      required: [token, user]
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/AuthUser"

    # --- Account (handoff 09) ---
    AuthUser:
      type: object
      description: |
        Not implemented yet (handoff 09). `phone` is the primary identifier
        (OTP login); `email` is optional and may be `""`/`null` when never
        set.
      required: [id, name, phone]
      properties:
        id:
          type: string
          example: "1"
