  /wallet/topup-requests:
    get:
      tags: [Wallet]
      summary: List current user's top-up requests
      description: "**Not implemented yet (handoff 14).**"
      operationId: getTopUpRequests
      responses:
        "200":
          description: Top-up requests (`TopUpRequest[]`)
          content:
            application/json:
              schema:
                type: array
                items:
