                  example: "دفع طلب #ORD-M3K2"
      responses:
        "200":
          description: New balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: number
                    example: 82.75
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

