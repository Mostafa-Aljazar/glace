  # --- Orders (handoff 12) — NOT IMPLEMENTED YET ---
  /orders:
    get:
      tags: [Orders]
      summary: List current user's orders
      description: "**Not implemented yet (handoff 12).** Newest first."
      operationId: getOrders
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated orders, newest first (`OrdersResponse`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Orders]
      summary: Create an order
      description: |
        **Not implemented yet (handoff 12).** **Critical:** the server MUST
        recompute all pricing (`unitPrice`, `addonTotal`, `subtotal`,
        `discount`, `total`) from `productId` / selection ids / quantity /
        `couponCode` — never trust prices sent by the frontend.
        `addressId` references a saved address (handoff 10); the server
        resolves and snapshots it into `order.address`. A delivery order
        containing a delivery-restricted item must be rejected with 422.
        Multipart request — `items` is sent as a JSON-encoded string field
        (the rest are plain form fields) since `receiptImage` is a real file.
      operationId: createOrder
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
