        images:
          - https://cdn.glace.ps/events/2-a.png
          - https://cdn.glace.ps/events/2-b.png
          - https://cdn.glace.ps/events/2-c.png
          - https://cdn.glace.ps/events/2-d.png

    IEventsListResponse:
      type: object
      description: Matches TypeScript `IEventsListResponse`
      required:
        - items
        - total
        - page
        - perPage
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IEvent"
        total:
          type: integer
          example: 10
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 8
        totalPages:
          type: integer
          example: 2
      example:
        items:
          - id: 2
            title: أجواء العيد مع جلاسيه غير
            date: "11/06/2020"
            description: كل عام وانتم بخير...
            listImage: https://cdn.glace.ps/events/2-list.png
            images:
              - https://cdn.glace.ps/events/2-a.png
        total: 10
        page: 1
        perPage: 8
        totalPages: 2

    IMenuCategory:
      type: object
      description: Matches TypeScript `IMenuCategory`
      required: [id, label, icon, accentColor, gradientFrom, gradientTo, sortOrder]
      properties:
        id:
          type: string
          example: pancake
        label:
          type: string
          example: بان كيك
        icon:
          type: string
          enum: [ice-cream, cup-soda, cake, glass-water, milk, apple]
          example: cake
        available:
          type: boolean
          default: true
          description: |
            Omit or `true` when the category is shown. `false` hides the whole
            section from the menu (e.g. hot drinks during summer).
          example: true
        accentColor:
          type: string
          example: "#f4a851"
        gradientFrom:
          type: string
          example: "#f4a851"
        gradientTo:
          type: string
          example: "#c97d2a"
        sortOrder:
          type: integer
          example: 11

    IFlavorOption:
      type: object
      description: |
        Matches TypeScript `IFlavorOption`.

        **handoff 02:** `available` is always required — send `false` for
        paused flavors. Do not omit the key when false (breaks frontend parse
        on cup / brad-boza). `family` detail must return a non-empty
        `flavors[]` with the same shape.
      required: [id, nameAr, nameEn, image, family, available]
      properties:
        id:
          type: string
          example: pistachio
        nameAr:
          type: string
          example: بيستاشيو
        nameEn:
          type: string
          example: Pistachio
        image:
          type: string
          format: uri
          description: Absolute flavor image URL — no `cdn.example.com` (handoff 03)
        family:
          type: string
          enum: [classic, special, stevia]
        available:
          type: boolean
          description: |
            Always present. `true` = orderable; `false` = shown disabled.
            Never drop this field when false.
          example: false
        isPremiumMixFlavor:
          type: boolean
          description: Priced at a mix's premiumFlavorPrice instead of flavorPrice

    IProductVariant:
      type: object
      description: |
        Matches TypeScript `IProductVariant` — one row in a flat-list product.

        **handoff 01:** `image` is required for every item (all 15 flat-list
        products / 69 variants). Used on the order list AND inside the mix /
        super-mix modal. Upload per item from Filament (not only product.image).
      required: [id, label, price, available, image]
      properties:
        id:
          type: string
          description: |
            Stable, dashboard-safe identifier, unique within the product.
            Mixes reference items by THIS id (`IMixRule.itemIds`), so renaming
            `label` from the dashboard never breaks a mix rule.
          example: nutella
        label:
          type: string
          example: نوتيلا
        price:
          type: number
          example: 11
        description:
          type: string
        image:
          type: string
          format: uri
          description: |
            Per-item thumbnail — absolute URL. Required on every `items[]`
            entry (handoff 01). Empty/missing → blank circle in UI.
          example: https://cdn.glace.ps/menu/pancake-nutella.jpg
        available:
          type: boolean
        isPremiumMixFlavor:
          type: boolean
          description: |
            When true inside a mix, charge `premiumFlavorPrice` instead of
            `flavorPrice`. Toggle from Filament on the item (handoff 07).

    IMixRule:
      type: object
      description: |
        Matches TypeScript `IMixRule` — مكس / سوبر مكس on flat-list products.

        **handoff 07:** full CRUD from Filament (label, pick, prices, itemIds,
        available). `itemIds` reference `items[].id` on the same product only.
      required: [id, label, pick, basePrice, flavorPrice, premiumFlavorPrice, itemIds]
      properties:
        id:
          type: string
          description: Stable seed id (`mix`, `super-mix`) — do not rename after orders exist
          example: mix
        label:
          type: string
          example: مكس (اختر طعمين)
        available:
          type: boolean
          default: true
          description: |
            Prefer always sending the field. `false` hides this mix on the
            order page. Omit or `true` = offered.
          example: true
        pick:
          type: integer
          example: 2
        basePrice:
          type: number
          example: 14
        flavorPrice:
          type: number
          example: 7
        premiumFlavorPrice:
          type: number
          example: 11
        itemIds:
          type: array
          description: |
            Ids of the `items[]` this mix can be built from — these are
            `IProductVariant.id` values on the SAME product.

            NOT flavor ids, and NOT labels. (This field was previously named
            `flavorOptionIds` and held Arabic labels; matching by label broke
            whenever an item was renamed from the dashboard.)
          items:
            type: string
          example: [nutella, lotus, pistachio]

    IPriceCell:
      type: object
      description: Matches TypeScript `IPriceCell`
      required: [flavorFamily, price]
      properties:
        flavorFamily:
          type: string
          enum: [classic, special, mix]
        price:
          type: number
          example: 4

    IContainerOption:
      type: object
      description: |
        Matches TypeScript `IContainerOption` — builder "type" pills
        (كاسة/بسكوت, ليمون/مانجا, بلاستيك/فلين…).

        **handoff 05:** full Filament CRUD (add / edit / delete / available /
        image / pricingLabel). Not step titles — those stay frontend-only.
      required: [id, label, available]
      properties:
        id:
          type: string
          example: biscuit
        label:
          type: string
          example: بسكوت
        available:
          type: boolean
        name:
          type: string
          description: Overrides the product's own name when this container is picked
          example: بوظة بسكوت
        image:
          type: string
          format: uri
          description: Absolute URL — fallback thumbnail when size.image is missing
        pricingLabel:
          type: string
          description: Heading for this container's price table, e.g. "الكاسة"
          example: الكاسة

    ISizeOption:
      type: object
      description: |
        Matches TypeScript `ISizeOption`.

        **handoff 05:** Filament CRUD for sizes + `prices[]` + optional
        `image` (strongly preferred for family merged rows).
      required: [id, label, maxBalls, prices]
      properties:
        id:
          type: string
          example: plastic-half
        label:
          type: string
          example: 1/2 لتر
        maxBalls:
          type: integer
          example: 8
        prices:
          type: array
          items:
            $ref: "#/components/schemas/IPriceCell"
        containerId:
          type: string
          description: Restricts this size to one IContainerOption id
          example: plastic
        available:
          type: boolean
          default: true
          description: |
            Omit or `true` when the size is orderable. `false` renders the size
            greyed with a "غير متوفر" badge instead of removing it.

            Needed to stop a single size independently of its container — e.g.
            بوظة عائلي merges container+size into one step, so disabling
            "1 لتر فلين" must be possible without disabling "1/2 لتر فلين".
          example: true
        image:
          type: string
          format: uri
          description: |
            Thumbnail for this size on the order page (especially family
            merged "نوع + حجم" rows). Preferred over `containerOptions[].image`
            when both are set. Absolute URL via Storage::url(...) (handoff 05).
          example: https://cdn.glace.ps/menu/sizes/family-plastic-half.png

    IProductBase:
      type: object
      description: Fields shared by every IProduct variant (see the `kind` discriminator on IProduct)
      required: [id, slug, categoryId, name, image, sortOrder, available]
      properties:
        id:
          type: string
          description: |
            Opaque backend primary key (auto-increment int or UUID). Used for
            cart/order/favorites references sent back to the API — NEVER
            rendered in a URL. Do not assume it equals `slug`.
          example: "a1c3e5f7-1111-4b22-9c33-aa44bb55cc66"
        slug:
          type: string
          description: |
            Stable, URL-safe identifier matched against `/menu/order/{type}`
            and used to fetch the product (`GET /menu/products/{slug}`). Must be
            unique and stable — renaming the display `name` must NOT change it.
          example: pancake
        categoryId:
          type: string
          example: pancake
        name:
          type: string
          example: بان كيك
        description:
          type: string
          description: Short product description shown on the order page
          example: بان كيك طازج بنكهات متنوعة
        image:
          type: string
          format: uri
          description: |
            Product hero image — absolute URL. Brad-boza uses **this field only**
            (no companion / secondary cup image — handoff 06).
          example: https://cdn.glace.ps/menu/pancake.jpg
        sortOrder:
          type: integer
          example: 1
        available:
          type: boolean
        addons:
          type: array
          description: |
            Optional per-unit extras a customer can add to this product
            (toppings, sauces...). Drives the cart's "تخصيص الإضافات" flow,
            where the additions can be applied uniformly to all units or
            differently per individual unit.
          items:
            $ref: "#/components/schemas/IAddonOption"
        hasAddons:
          type: boolean
          description: Legacy flag — superseded by a non-empty `addons` array.
        hasNotes:
          type: boolean
        hasFavorites:
          type: boolean
        hasImageZoom:
          type: boolean
        inStoreOnly:
          type: boolean
          description: Shows an in-store-only warning before entering the order flow

    IAddonOption:
      type: object
      description: |
        Matches TypeScript `IAddonOption` — one optional per-unit extra, served
        by `GET /menu/addons` and/or a product's `addons` catalog. Each addon's
        `type` (set in the dashboard) decides how it's picked in the cart:
        `toggle` (on/off) or `counter` (a quantity stepper, e.g. extra biscuit).
      required: [id, label, price]
      properties:
        id:
          type: string
          description: Stable slug for the addon
          example: extra-caramel
        label:
          type: string
          example: صوص كراميل إضافي
        price:
          type: number
          description: Per-unit surcharge (₪), charged per selected quantity
          example: 3
        available:
          type: boolean
        type:
          type: string
          enum: [toggle, counter]
          default: toggle
          description: |
            How the customer picks this addon — `toggle` (on/off checkbox,
            default) or `counter` (+/- quantity stepper, e.g. extra biscuit ×3).
          example: toggle
        maxQty:
          type: integer
          description: Optional cap for `counter` addons (max quantity per unit)
          example: 10

    IBuilderProduct:
      description: |
        Matches TypeScript `IBuilderProduct` — size/flavor wizard
        (cup, family, brad, brad-boza).

        **handoff 05 · 06:** Filament manages `containerOptions`, `sizes`
        (+ images/prices), and brad-boza `iceCreamAddonPrices`. Do **not**
        send `secondaryImage`. Step titles («اختر النوع» / «اختر الحجم») are
        frontend-only — not API fields.
      allOf:
        - $ref: "#/components/schemas/IProductBase"
        - type: object
          required: [kind, sizes]
          properties:
            kind:
              type: string
              enum: [builder]
            containerOptions:
              type: array
              description: Types managed from Filament (handoff 05)
              items:
                $ref: "#/components/schemas/IContainerOption"
            includesIceCreamStep:
              type: boolean
              description: |
                Brad-boza only — renders the extra ice-type + flavor-ball step.
                Does NOT imply a second hero image.
            iceCreamAddonPrices:
              type: array
              description: Brad-boza additive prices — Filament-editable (handoff 05)
              items:
                $ref: "#/components/schemas/IPriceCell"
            hasExtraBiscuitAddon:
              type: boolean
            pricingLabel:
              type: string
              description: |
                Price-table heading when sizes aren't split per container
                (handoff 06). Prefer the full title already including "أسعار"
                (e.g. "أسعار البراد"), or just the noun ("البراد") —
                the frontend only prefixes "أسعار" when missing.
                Unused when sizes carry containerId (container.pricingLabel wins).
              example: أسعار البراد
            sizes:
              type: array
              description: Sizes + prices (+ optional image) — Filament CRUD (handoff 05)
              items:
                $ref: "#/components/schemas/ISizeOption"
            selectionMode:
              type: string
              enum: [repeatable, toggle]
            flavorFamilies:
              type: array
              items:
                type: string
                enum: [classic, special, mix]
            flavors:
              type: array
              description: |
                Flavor balls served INLINE — no separate `/menu/flavors` endpoint.

                Returned by `GET /menu/products/{slug}` (detail) ONLY. The
                `GET /menu/products` list MUST omit it (handoff 02).

                Required for builder products with a non-empty `flavorFamilies`
                (`cup`, `family`, `brad-boza`). `family` MUST return a non-empty
                array. `brad` has no flavor step and does not need it.
                Every element must include `available` even when `false`.
              items:
                $ref: "#/components/schemas/IFlavorOption"

    IFlatListProduct:
      description: |
        Matches TypeScript `IFlatListProduct` — flat items + optional mixes
        (milkshake, pancake, waffle, …).

        **handoff 01 · 07:** every `items[]` row requires `image`. `mixes[]`
        (مكس / سوبر مكس) are Filament-managed when the product offers them.
      allOf:
        - $ref: "#/components/schemas/IProductBase"
        - type: object
          required: [kind, items]
          properties:
            kind:
              type: string
              enum: [flat-list]
            items:
              type: array
              description: |
                Variants shown on the order page. Each item MUST include
                `image` (handoff 01) — also used inside the mix modal.
              items:
                $ref: "#/components/schemas/IProductVariant"
            mixes:
              type: array
              description: |
                Optional mix rules (handoff 07). Filament CRUD; `available: false`
                hides the rule. `itemIds` → same product's `items[].id`.
              items:
                $ref: "#/components/schemas/IMixRule"

    IProduct:
      description: Matches TypeScript `IProduct` — discriminated union on `kind`
      oneOf:
        - $ref: "#/components/schemas/IBuilderProduct"
        - $ref: "#/components/schemas/IFlatListProduct"
      discriminator:
        propertyName: kind
        mapping:
          builder: "#/components/schemas/IBuilderProduct"
          flat-list: "#/components/schemas/IFlatListProduct"

    # --- Addresses (handoff 10) — NOT IMPLEMENTED YET ---
    SavedAddress:
      type: object
      description: Matches TypeScript `SavedAddress` (addressStore) — not implemented yet (handoff 10)
      required: [id, type, label, name, phone, city, zoneId, street, isDefault]
      properties:
        id:
          type: string
          example: addr_123
        type:
          type: string
          enum: [home, work, other]
        label:
          type: string
          example: المنزل
        name:
          type: string
          example: أحمد علي
        phone:
          type: string
          example: "0599123456"
        city:
          type: string
          example: غزة
        zoneId:
          type: string
          description: References `DeliveryZone.id`
          example: rimal
        street:
          type: string
          example: شارع الجلاء
        landmark:
          type: string
          nullable: true
        location:
          type: object
          nullable: true
          properties:
            lat:
              type: number
            lng:
              type: number
        isDefault:
          type: boolean

    AddressRequest:
      type: object
      description: |
        Request body for create/update — not implemented yet (handoff 10).
        `isDefault` is never sent by the client; it's computed server-side
        (first address a user adds becomes default automatically, see
        `POST /addresses/{id}/default` to change it afterwards).
      required: [type, label, name, phone, city, zoneId, street]
      properties:
        type:
          type: string
          enum: [home, work, other]
        label:
          type: string
        name:
          type: string
        phone:
          type: string
        city:
          type: string
          example: غزة
        zoneId:
          type: string
        street:
          type: string
        landmark:
          type: string
          nullable: true
        location:
          type: object
          nullable: true
          properties:
            lat:
              type: number
            lng:
              type: number

    DeliveryZone:
      type: object
      description: |
        Matches `src/lib/deliveryZones.ts` shape exactly — not implemented
        yet (handoff 10). Returned by `GET /addresses/delivery-zones`.
      required: [id, name, fee]
      properties:
        id:
          type: string
          example: rimal
        name:
          type: string
          example: الرمال
        description:
          type: string
          nullable: true
          example: حي الرمال
        fee:
          type: number
          example: 10

    # --- Cart (handoff 11) — NOT IMPLEMENTED YET ---
    ApplyCouponRequest:
      type: object
      description: Not implemented yet (handoff 11)
      required: [code, subtotal]
      properties:
        code:
          type: string
          example: GLACE10
        subtotal:
          type: number
          example: 33

    ApplyCouponResponse:
      type: object
      description: Not implemented yet (handoff 11)
      required: [valid]
      properties:
        valid:
          type: boolean
        discount:
          type: number
          description: Discount amount in ₪ (absolute, already resolved from the code's percentage)
          example: 3.3
        message:
          type: string
          nullable: true
          description: Set when `valid` is false (e.g. expired/unknown code)

    # --- Orders (handoff 12) — NOT IMPLEMENTED YET ---
    CartSelection:
      type: object
      description: Matches TypeScript `CartSelection` (cartStore) — not implemented yet (handoff 12)
      required: [kind, id, label, qty, unitPrice]
      properties:
        kind:
          type: string
          enum: [flavor, mix, addon]
        id:
          type: string
        label:
          type: string
        qty:
          type: integer
        unitPrice:
          type: number

    CartItem:
      type: object
      description: Matches TypeScript `CartItem` (cartStore) — not implemented yet (handoff 12)
      required: [productId, name, unitPrice, quantity]
      properties:
        productId:
          type: string
        name:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        size:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        container:
          type: string
          nullable: true
        flavorFamily:
          type: string
          enum: [classic, special, mix]
          nullable: true
        selections:
          type: array
          items:
            $ref: "#/components/schemas/CartSelection"
        addonTotal:
          type: number
          default: 0
        unitPrice:
          type: number
        quantity:
          type: integer
        flatSelections:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CartSelection"
        flatAddonTotal:
          type: number
          nullable: true

    CreateOrderRequest:
      type: object
      description: |
        Not implemented yet (handoff 12). Client-computed price fields
        (`subtotal`/`discount`/`total`) are NOT part of this request — the
        server recomputes everything from `items`/`couponCode`.
      required: [items, paymentMethod, deliveryMethod]
      properties:
        items:
          type: string
          description: JSON-encoded `CartItem[]` — a plain array field can't travel in multipart/form-data, so the frontend stringifies it.
          example: '[{"productId":"b7f1c2a4-...","name":"بوظة كاسة","unitPrice":15,"quantity":2,"addonTotal":3,"selections":[]}]'
        couponCode:
          type: string
          nullable: true
        paymentMethod:
          type: string
          enum: [jawwal, jawwal-manual, paypal, cash, visa, wallet, bop]
        deliveryMethod:
          type: string
          enum: [delivery, pickup, dine-in]
        addressId:
          type: string
          nullable: true
          description: Required when `deliveryMethod` is `delivery`. References `SavedAddress.id`.
        pickupTime:
          type: string
          nullable: true
          format: date-time
        receiptImage:
          type: string
          format: binary
          nullable: true
          description: Required (or `receiptNote`) when `paymentMethod` is jawwal-manual/paypal/bop
        receiptNote:
          type: string
          nullable: true
        jawwalPhone:
          type: string
          nullable: true
          description: |
            Required when `paymentMethod` is `jawwal` (automatic) — the
            phone JawwalPay sent the confirmation code to via
            `POST /orders/jawwal/send-code`.
        jawwalCode:
          type: string
          nullable: true
          description: |
            Required when `paymentMethod` is `jawwal`. The server verifies
            this against JawwalPay for `jawwalPhone`/`total` before creating
            the order — a wrong/expired code fails with 422 and no order is
            created.

    OrderAddressSnapshot:
      type: object
      description: Order-time snapshot of a SavedAddress — not implemented yet (handoff 12)
      properties:
        name:
          type: string
        phone:
          type: string
        city:
          type: string
        area:
          type: string
          description: Zone name at order time (resolved server-side from `zoneId`)
        street:
          type: string
        landmark:
          type: string
          nullable: true
        note:
          type: string
          nullable: true

    OrderDriver:
      type: object
      description: Not implemented yet (handoff 12)
      properties:
        id:
          type: string
        name:
          type: string
          example: محمود الأحمد
        phone:
          type: string
          example: "0599876543"
        company:
          type: string
          example: توصيل فلسطين

    Order:
      type: object
      description: Matches TypeScript `Order` (orderStore) — not implemented yet (handoff 12)
      required: [id, items, subtotal, discount, total, paymentMethod, deliveryMethod, status, createdAt]
      properties:
        id:
          type: string
          example: ORD-M3K2A1
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        discount:
          type: number
        total:
          type: number
        paymentMethod:
          type: string
          enum: [jawwal, jawwal-manual, paypal, cash, visa, wallet, bop]
        deliveryMethod:
          type: string
          enum: [delivery, pickup, dine-in]
        address:
          $ref: "#/components/schemas/OrderAddressSnapshot"
        pickupTime:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [قيد المراجعة, جاري التحضير, جاهز للاستلام, في الطريق, تم التسليم, تم الاستلام, ملغي, مسترد]
        createdAt:
          type: string
          format: date-time
        receiptImage:
          type: string
          format: uri
          nullable: true
        receiptNote:
          type: string
          nullable: true
        cancelReason:
          type: string
          nullable: true
        driver:
          allOf:
            - $ref: "#/components/schemas/OrderDriver"
          nullable: true
        driverAssignedAt:
          type: string
          format: date-time
          nullable: true
        preparationTime:
          type: integer
          description: Minutes (5-30), set by server/staff
          nullable: true
        estimatedDeliveryTime:
          type: integer
          description: Minutes (10-25), delivery orders only
          nullable: true
        receivedAt:
          type: string
          format: date-time
          nullable: true

    OrdersResponse:
      type: object
      description: Not implemented yet (handoff 12). Same page-envelope shape as `WalletTransactionsResponse`.
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        totalPages:
          type: integer

    # --- Payments (handoff 13) — NOT IMPLEMENTED YET ---
    MerchantPaymentAccount:
      type: object
      description: |
        Matches `src/lib/merchantPaymentAccounts.ts` shape exactly — not
        implemented yet (handoff 13). `visa` has no transfer account —
        `inStoreOnly: true` and no `accountLabel`/`accountValue`/`holderName`,
        since it can only be paid on the in-store card terminal.
      required: [method]
      properties:
        method:
          type: string
          enum: [bop, jawwal, jawwal-manual, paypal, visa]
        inStoreOnly:
          type: boolean
          nullable: true
          description: True only for `visa` — no online transfer, pay in-store only.
        qrImage:
          type: string
          format: uri
          nullable: true
        holderName:
          type: string
          nullable: true
        bankName:
          type: string
          nullable: true
          description: Bank-only accounts (bop)
        accountLabel:
          type: string
          nullable: true
          description: e.g. "رقم الحساب" or "رقم الجوال"
        accountValue:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true

    # --- Wallet (handoff 14) — NOT IMPLEMENTED YET ---
    WalletTransaction:
      type: object
      description: Not implemented yet (handoff 14)
      required: [id, date, amount, type, label]
      properties:
        id:
          type: string
        date:
          type: string
          format: date-time
        amount:
          type: number
        type:
          type: string
          enum: [credit, debit]
        label:
          type: string
        method:
          type: string
          enum: [bop, paypal, jawwal, jawwal-manual, visa, cash, wallet]
          nullable: true
        receiptImage:
          type: string
          format: uri
          nullable: true

    WalletResponse:
      type: object
      description: |
        Not implemented yet (handoff 14). Balance only — see
        `WalletTransactionsResponse` for the paginated transaction history.
      required: [balance]
      properties:
        balance:
          type: number
          example: 105.25

    WalletTransactionsResponse:
      type: object
      description: |
        Not implemented yet (handoff 14). Same pagination shape as
        `IEventsListResponse` — `items` newest first.
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"
        total:
          type: integer
          example: 46
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 3

    TopUpRequest:
      type: object
      description: |
        Not implemented yet (handoff 14). `amount` is nullable while the
        request is `قيد المراجعة` for receipt-based methods (bop, paypal,
        jawwal-manual) — the customer never types it, the reviewer reads it
        off the uploaded receipt and sets it on approval. Only the `jawwal`
        automatic flow always has it set upfront (no receipt to read it from).
      required: [id, method, status, createdAt]
      properties:
        id:
          type: string
        amount:
          type: number
          nullable: true
        method:
          type: string
          enum: [bop, paypal, jawwal, jawwal-manual]
        status:
          type: string
          enum: [قيد المراجعة, مكتمل]
        createdAt:
          type: string
          format: date-time
        receiptImage:
          type: string
          format: uri
          nullable: true
        receiptNote:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: Only for the jawwal automatic method

    Faq:
      type: object
      description: |
        Not implemented yet (handoff 15). `answer` uses "\n\n" to separate
        paragraphs; a paragraph starting with "- " renders as a bullet list
        (each line one item). `link` is an optional trailing CTA, e.g. the
        contact page.
      required: [id, question, answer]
      properties:
        id:
          type: string
        question:
          type: string
        answer:
          type: string
        link:
          type: object
          nullable: true
          required: [href, label]
          properties:
            href:
              type: string
            label:
              type: string

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# Default security for protected routes.
# Override with `security: []` on public endpoints (e.g. login, register).
security:
  - bearerAuth: []
