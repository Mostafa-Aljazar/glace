          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: |
            Validation failed, or a delivery-restricted item was included
            with `deliveryMethod: delivery`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/jawwal/send-code:
    post:
      tags: [Orders]
      summary: Start jawwal (automatic) payment for a pending order — server asks JawwalPay to text a payment code
      description: |
        **Not implemented yet (handoff 12).** Same JawwalPay integration as
        `POST /wallet/topup-requests/jawwal/send-code` — the server asks
        JawwalPay to text `phone` a code confirming payment of `amount`
        (the order total). The returned code is then passed as
        `jawwalPhone`/`jawwalCode` on the immediately-following
        `POST /orders` call — the frontend never talks to JawwalPay
        directly, and no order exists yet at this point. Rate-limit per
        phone to avoid SMS abuse.
      operationId: sendJawwalOrderCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, amount]
              properties:
                phone:
                  type: string
