  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: |
        **Not implemented yet (handoff 12).** Rejected with 409 if the order
        is already in a final status (delivered/received/cancelled/refunded).
        Sets status to `ملغي` only — does NOT refund to the wallet
        automatically. The paid amount stays "قيد المراجعة" (under review)
        until staff verifies and processes it; a separate, later transition
        to `مسترد` (refunded, likely via a staff/dashboard action, out of
        scope for this handoff) is what actually credits the wallet. The
        frontend's cancel dialog reflects this — "قيد المراجعة", not an
        instant/automatic refund.
      operationId: cancelOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  example: غيرت رأيي
      responses:
        "200":
          description: Cancelled (`Order`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Order already in a final status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

